<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Romblon</title>
    <style>
      body {
        margin: 0;
        font-family: "Arial", sans-serif;
        width: 100%;
        height: 100vh;
        background-image: url(/ROMBLON.jpg);
        background-size: cover;
        background-position: center 20px;
        background-repeat: no-repeat;
      }

      .container {
        position: relative;
        height: 100%;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #7eb3c6;
        padding: 20px 40px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        position: relative;
        z-index: 1;
      }
      .logo-container {
        display: flex;
        align-items: center;
      }
      .logo {
        display: flex;
        align-items: center;
        margin-right: 20px;
      }

      .header-title {
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
      }
      nav {
        display: flex;
        gap: 20px;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 4px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      nav a:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
      nav a:active {
        background-color: #333;
        color: #fff;
      }

      #marble {
        position: absolute;
        bottom: 40px;
        width: 100%;
        text-align: center;
        font-size: 30px;
        color: #fff;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.3);
        padding: 10px 0;
      }

      @media (max-width: 600px) {
        header {
          flex-direction: column;
          align-items: flex-start;
          padding: 15px;
        }
        #marble {
          font-size: 20px;
          padding: 8px 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-container">
          <div class="logo">
            <div class="header-title">WELCOME TO ROMBLON!</div>
          </div>
        </div>
        <nav>
          <a href="splashpage.html">Home</a>
          <a href="home.html">Discover</a>
          <a href="/contacts.html">Contact</a>
        </nav>
      </header>
      <div id="marble">MARBLE CAPITAL OF THE PHILIPPINES</div>
    </div>
  </body>
</html>
