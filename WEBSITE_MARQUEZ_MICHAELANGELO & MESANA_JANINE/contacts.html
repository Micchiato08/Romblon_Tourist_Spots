<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Café</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #e0d7c6;
        color: #333;
      }
      .container {
        position: relative;
        min-height: 100vh;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        background-color: #7eb3c6;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .logo-container {
        display: flex;
        align-items: center;
      }
      .logo {
        display: flex;
        align-items: center;
        font-family: "Brush Script MT", cursive;
        font-size: 1.8em;
        font-weight: normal;
      }
      .header-title {
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
        margin: 0;
      }
      nav {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 4px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      nav a:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
      .main {
        max-width: 800px;
        margin: 30px auto;
        padding: 20px;
        background-color: #f5f0e6;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .main h1 {
        font-family: "Brush Script MT", cursive;
        font-size: 2em;
        margin-bottom: 15px;
      }
      .main p {
        font-size: 1em;
        line-height: 1.5;
      }
      .contact {
        text-align: center;
        margin: 40px 0 20px 0;
        padding: 0 10px;
      }
      .social-icons {
        margin-top: 10px;
      }
      .social-icons span {
        margin: 0 15px;
        font-size: 1.5em;
        color: #555;
        cursor: pointer;
        display: inline-block;
      }
      .social-icons span:hover {
        color: #000;
      }
      .message-form {
        margin-top: 20px;
      }
      .message-box {
        width: 80%;
        max-width: 400px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 1em;
        box-sizing: border-box;
      }
      .send-btn {
        display: inline-block;
        width: 150px;
        max-width: 100%;
        margin: 10px auto;
        padding: 10px;
        background-color: #3399ff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
      }
      .send-btn:hover {
        background-color: #0077ff;
      }

      @media (max-width: 600px) {
        header {
          flex-direction: column;
          align-items: flex-start;
          padding: 15px;
        }
        nav {
          gap: 10px;
        }
        .header-title {
          font-size: 1.2em;
        }
        .main h1 {
          font-size: 1.5em;
        }
        .social-icons span {
          margin: 0 10px;
          font-size: 1.3em;
        }
        .message-box {
          width: 100%;
        }
        .send-btn {
          width: 100%;
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-container">
          <div class="logo">
            <div class="header-title">WELCOME TO ROMBLON!</div>
          </div>
        </div>
        <nav>
          <a href="splashpage.html">Home</a>
          <a href="home.html">Discover</a>
          <a href="contacts.html">Contact</a>
        </nav>
      </header>
      <div class="main">
        <h1>ROMBLON FEEDBACK</h1>
        <p>
          Leaving a feedback would greatly help the Romblon island improvements
          for the future. THANK YOU!
        </p>
      </div>
      <div class="contact">
        <div>Contact us at:</div>
        <div class="social-icons">
          <span>
            <a href="https://www.facebook.com/share/1boFNMZJVj/">
              <i class="fab fa-facebook"></i>
            </a>
          </span>
          <span>
            <a
              href="https://www.instagram.com/bleuu_very?igsh=MWZrM2lwZGFtYWI5cA=="
            >
              <i class="fab fa-instagram"></i>
            </a>
          </span>
          <span>
            <a href="mailto:mesanajanine0@gmail.com">
              <i class="fas fa-envelope"></i>
            </a>
          </span>
        </div>
        <form class="message-form">
          <input
            type="text"
            class="message-box"
            placeholder="Write message here..."
          />
          <button type="submit" class="send-btn">Send message</button>
        </form>
      </div>
    </div>
  </body>
</html>
